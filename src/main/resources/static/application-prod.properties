# ======================================================================
# Production profile: run with  SPRING_PROFILES_ACTIVE=prod
# Every secret/URL comes from environment variables. Nothing sensitive here.
# ======================================================================
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${root}
spring.datasource.password=${Mariyappan@06}

# "update" only adds missing tables/columns (it never drops data). Run database/schema.sql once on the production DB if you prefer to create tables yourself.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Browsers must send the login cookie only over HTTPS in production
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# Hide stack traces from API responses
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=framework

# Static files may be cached for a short time in production
spring.web.resources.cache.cachecontrol.max-age=10m
logging.level.root=WARN
logging.level.com.msme.cashflowguard=INFO
