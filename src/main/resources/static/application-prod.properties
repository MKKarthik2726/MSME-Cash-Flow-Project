# ======================================================================
# Production profile: run with  SPRING_PROFILES_ACTIVE=prod
# Every secret/URL comes from environment variables. Nothing sensitive here.
# ======================================================================

# Production profile
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=framework

spring.web.resources.cache.cachecontrol.max-age=10m
logging.level.root=WARN
logging.level.com.msme.cashflowguard=INFO

