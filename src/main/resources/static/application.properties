# ======================================================================
# MSME CashFlow Guard - default (local) configuration
# Secrets are NEVER written here. Provide them as environment variables
# or in application-local.properties (git-ignored).
# ======================================================================
spring.application.name=msme-cashflow-guard
server.port=${PORT:8080}

# ---- MySQL (create the schema first: see database/schema.sql) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/msme_cashflow_guard?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Mariyappan@06}

# ---- JPA / Hibernate ----
# "update" creates missing tables/columns. Use "validate" once the schema is stable.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- File upload limits (the CSV upload) ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Login session cookie ----
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ---- Misc ----
spring.jackson.time-zone=Asia/Kolkata
spring.web.resources.cache.cachecontrol.max-age=0
logging.level.root=INFO
logging.level.com.msme.cashflowguard=INFO
